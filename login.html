<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | SnatchPost</title>
    
    <!-- Иконки Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Стили: путь изменен на src/shared/... так как файл теперь в корне -->
    <link rel="stylesheet" href="src/shared/styles/base.css">
    <link rel="stylesheet" href="src/shared/styles/headerfooter.css">
    <link rel="stylesheet" href="src/shared/styles/feed.css">
    <link rel="stylesheet" href="src/shared/styles/forms.css">
    <link rel="stylesheet" href="src/shared/styles/utilities.css">
    <link rel="stylesheet" href="src/shared/styles/responsive.css">
</head>
<body>
    <header class="site-header">
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        
        <!-- Обновленная иконка профиля (как в index.html) -->
        <div class="profile-menu-container">
            <a class="profile" href="login.html" aria-label="User menu">
                <span class="material-symbols-outlined">account_circle</span>
            </a>
        </div>
    </header>
    
    <main class="form-layout">
        <section class="form-card login-card">
            <h1>Welcome to SnatchPost</h1>
            <a href="#account-note">Create an account</a>
            <p>or<br><br>Please log in</p>
            
            <!-- Форма теперь отправляет на правильный путь -->
            <form action="src/pages/index.html" method="get">
                <label class="visually-hidden" for="email">Email</label>
                <input id="email" type="email" placeholder="Email" autocomplete="email" required>
                
                <label class="visually-hidden" for="password">Password</label>
                <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
                
                <button type="submit">Login</button>
            </form>
            
            <a href="#password-note">Forgot password</a>
            
            <p id="account-note" class="form-note">
                Account creation is outside this static demo.
            </p>
            <p id="password-note" class="form-note">
                Password recovery is outside this static demo.
            </p>
        </section>
    </main>
    
    <footer class="site-footer">
        SnatchPost
    </footer>
</body>
</html>
